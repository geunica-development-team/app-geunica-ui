<app-panel-header title="Configuración del sistema" />

<app-menu-tabs
    [tabs]="tabs"
    [activeTabId]="activeTab"
    (tabChanged)="setActiveTab($event)"
>
@if (activeTab === 'sedes') {
    <div class="mb-4 d-flex justify-content-center justify-content-md-end">
        <button class="btn-custom-green" (click)="modalAdd.openModal()">
            <i class="fa-solid fa-plus me-2"></i>Registrar nueva sede
        </button>
    </div>
    <div class="col-12">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="card-title mb-0">Sedes</h5>
                <div class="input-group" style="width: 250px;">
                <span class="input-group-text"><i class="fas fa-search"></i></span>
                <input (input)="applyFilter($event)" type="text" class="form-control form-control-sm" placeholder="Buscar sede...">
                </div>
            </div>
            <div class="card-body p-3">
                <app-table
                    #campusTable
                    [columns]="columnsCampus"
                    [originalRows]="rowsCampus"
                    [columnMappings]="columnMappingsCampus"
                    [pageSize]="10"
                    [acciones]="true"
                    [editarFila]="true"
                    [accionEditar]="openModalEdit.bind(this)"
                    [verFila]="false"
                    [eliminarFila]="true"
                    [accionEliminar]="openModalDelete.bind(this)"
                />
            </div>
        </div>
    </div>
}
@if (activeTab === 'roles') {
    <div class="mb-4 d-flex justify-content-center justify-content-md-end">
        <button hidden class="btn-custom-green" (click)="modalAdd.openModal()">
            <i class="fa-solid fa-plus me-2"></i>Registrar nuevo rol
        </button>
    </div>
    <div class="col-12">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="card-title mb-0">Roles</h5>
                <div class="input-group" style="width: 250px;">
                <span class="input-group-text"><i class="fas fa-search"></i></span>
                <input (input)="applyFilter($event)" type="text" class="form-control form-control-sm" placeholder="Buscar rol...">
                </div>
            </div>
            <div class="card-body p-3">
                <app-table
                    #rolesTable
                    [columns]="columnsRoles"
                    [originalRows]="rowsRoles"
                    [columnMappings]="columnMappingsRoles"
                    [pageSize]="10"
                    [acciones]="false"
                    [editarFila]="true"
                    [accionEditar]="openModalEdit.bind(this)"
                    [verFila]="false"
                    [eliminarFila]="true"
                    [accionEliminar]="openModalDelete.bind(this)"
                />
            </div>
        </div>
    </div>
}
</app-menu-tabs>

<app-modal-add
    #modalAdd
    [activeTab]="activeTab"
    (added)="onCreatedOrEditedOrDeleted()"
/>

<app-modal-edit
    #modalEdit
    [activeTab]="activeTab"
    (updated)="onCreatedOrEditedOrDeleted()"
/>

<app-modal-delete
    #modalDelete
    [activeTab]="activeTab"
    (deleted)="onCreatedOrEditedOrDeleted()"
/>
