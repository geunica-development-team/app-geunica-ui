<app-panel-header 
    title="Equipo académico"
/>

<div class="d-flex justify-content-end">
    <button
    class="btn-custom-green mb-3"
    (click)="modalAddInternalUser.openModal()"
    >
    <i class="fa-solid fa-plus me-2"></i>Añadir nuevo usuario
    </button>
</div>
<!-- Users Table -->
<div class="col-12">
  <div class="card">
    <div class="card-header d-grid d-lg-flex justify-content-between align-items-center">
      <h5 class="card-title mb-2 mb-lg-0">Lista de Usuarios Internos</h5>

      <div class="d-flex gap-3 align-items-center">
          <!-- Filtro por Estado USUARIO -->
          <select 
            class="form-select form-select-sm w-100"
            style="width: 200px;"
            [(ngModel)]="selectedUserStatus"
            (change)="applyFilters()">
            <option value="">Todos los estados</option>
            @for (status of userStatusOptions; track status.value) {
              <option [value]="status.value">{{ status.label }}</option>
            }
          </select>
          <!-- NUEVO: Filtro por ROL -->
          <select 
            class="form-select form-select-sm w-100"
            style="width: 200px;"
            [(ngModel)]="selectedRole"
            (change)="applyFilters()">
            <option value="">Todos los roles</option>
            @for (role of roleOptions; track role.value) {
              <option [value]="role.value">{{ role.label }}</option>
            }
          </select>

          <!-- Buscador -->
          <div class="input-group w-100" style="width: 250px;">
            <span class="input-group-text"><i class="fas fa-search"></i></span>
            <input 
              (input)="applySearchFilter($event)"
              type="text"
              class="form-control form-control-sm"
              placeholder="Buscar..."
              [(ngModel)]="searchValue">
          </div>
          
          <!-- Botón limpiar -->
          <button 
            type="button"
            class="btn btn-outline-secondary btn-sm"
            (click)="clearFilters()">
            <i class="fas fa-times"></i>
          </button>
      </div>
    </div>
    <div class="card-body p-3">
        <app-table
          #internalUsersTable
          [columns]="columns"
          [originalRows]="rows"
          [columnMappings]="columnMappings"
          [pageSize]="10"
          [acciones]="true"
          [editarFila]="true"
          [accionEditar]="openModalEditInternalUser.bind(this)"
          [eliminarFila]="true"
          [statusFilter]="selectedUserStatus"
          [roleFilter]="selectedRole"
          [searchFilter]="searchValue"
          [statusColumnKey]="userStatus"
        />
    </div>
  </div>
</div>

<app-modal-add-user
    #modalAddInternalUser
    (internalUserAdded)="onCreatedOrEditedOrDeleted()"
/>

<app-modal-edit-user
    #modalEditInternalUser
    (internalUserEdited)="onCreatedOrEditedOrDeleted()"
/>
