<ng-template #modalAddInternalUser let-modal>
  <div class="modal-header px-4">
    <h4 class="modal-title fw-semibold text-dark mb-0">Registrar nuevo usuario</h4>
    <button 
    type="button" 
    class="btn-close" 
    aria-label="Close"
    (click)="onCancel()">
    </button>
  </div>
  <form [formGroup]="formAddInternalUser" (ngSubmit)="addInternalUser()" id="formAddInternalUser">
    <div class="modal-body bg-white p-4">
      <div class="section-divider">
        <h5 class="fw-semibold mb-0">Datos del Usuario</h5>
      </div>
      <div class="row">
        <div class="col-md-4 mb-3">
          <label class="form-label fw-medium small">Nombres</label>
          <input 
            type="text" 
            class="form-control rounded" 
            placeholder="Nombres"
            name="names"
            formControlName="names">
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label fw-medium small">Apellido paterno</label>
          <input 
            type="text" 
            class="form-control rounded" 
            placeholder="Apellido paterno"
            name="paternalSurname"
            formControlName="paternalSurname">
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label fw-medium small">Apellido materno</label>
          <input 
            type="text" 
            class="form-control rounded" 
            placeholder="Apellido materno"
            name="maternalSurname"
            formControlName="maternalSurname">
        </div>
      </div>
      <div class="row">
        <div class="col-md-3 mb-3">
          <label class="form-label fw-medium small">Tipo de documento</label>
          <select class="form-select form-control" formControlName="typeOfIdentityDocument">
            <option value="" disabled>Selecciona tipo de documento</option>
            <option value="DNI">DNI</option>
            <option value="CE">Carné de extranjería</option>
            <option value="PAS">Pasaporte</option>
          </select>
        </div>
        <div class="col-md-3 mb-3">
          <label class="form-label fw-medium small">N° documento</label>
          <input 
          type="text" 
          class="form-control rounded" 
          placeholder="N° de documento"
          name="documentNumber"
          formControlName="documentNumber"
          (ngModelChange)="credentialsMode === 'automatic' && generateAutomaticCredentials() "
          >
        </div>
        <div class="col-md-3 mb-3">
          <label class="form-label fw-medium small">Fecha de nacimiento</label>
          <input 
          type="date" 
          class="form-control rounded" 
          name="birthDate"
          formControlName="birthDate">
        </div>
        <div class="col-md-3 mb-3">
          <label class="form-label fw-medium small">Género</label>
          <select class="form-select form-control" formControlName="gender">
            <option value="" disabled>Selecciona género</option>
            <option value="Femenino">Femenino</option>
            <option value="Masculino">Masculino</option>
            <option value="Otro">Otro</option>
          </select>
        </div>
      </div>
      <!-- Fila: Número documento + Teléfono -->
      <div class="row">
        <div class="col-md-4 mb-3">
          <label class="form-label fw-medium small">Número de teléfono</label>
          <input 
          type="text" 
          class="form-control rounded" 
          placeholder="Teléfono"
          name="phoneNumber"
          formControlName="phoneNumber">
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label fw-medium small">Dirección</label>
          <input 
          type="text" 
          class="form-control rounded" 
          placeholder="Dirección"
          name="address"
          formControlName="address">
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label fw-medium small">Correo Personal</label>
          <input 
            type="email" 
            class="form-control rounded" 
            placeholder="Correo"
            name="email"
            formControlName="email">
        </div>
      </div>
      <div class="section-divider">
        <h5 class="fw-semibold mb-0">Datos de la Cuenta</h5>
      </div>
      <!-- Fila: Rol + Estado -->
      <div class="row">
        <div class="col-md-4 mb-3">
          <label class="form-label fw-medium small">Rol</label>
          <select class="form-select form-control" formControlName="role">
            <option value="" disabled>Selecciona un rol</option>
            @for (role of roles; track role.id) {
              <option [value]="role.id"> {{ getRoleText(role.role) }} </option>
            }
          </select>
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label fw-medium small">Estado</label>
          <select class="form-select form-control" formControlName="state">
            <option value="" disabled>Selecciona un estado</option>
            <option value="active">Activo</option>
            <option value="inactive">Inactivo</option>
          </select>
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label fw-medium small">Sede</label>
          <select class="form-select form-control" formControlName="campus">
            <option value="" disabled>Selecciona una sede</option>
            @for (campus of campus; track campus.id) {
              <option [value]="campus.id"> {{campus.name}} </option>
            }
          </select>
        </div>
      </div>
      @if (isTeacherRoleSelected) {
        <div class="section-divider">
          <h5 class="fw-semibold mb-0">Datos del docente</h5>
        </div>
        <div class="row">
          <div class="col-12 mb-3">
            <label class="form-label fw-medium small">Especialidad</label>
            <input 
              type="text" 
              class="form-control rounded" 
              placeholder="Especialidad"
              name="specialty"
              formControlName="specialty">
          </div>
        </div>
      }

      <!-- Fila: Credenciales (automáticas o manuales) -->
      <div class="section-divider">
        <h5 class="fw-semibold mb-0">Generar credenciales</h5>
      </div>

      <div class="d-flex flex-column gap-3 mb-3">
        <div class="form-check">
          <input 
            class="form-check-input" 
            type="radio" 
            name="credentialsMode"
            id="automatic"
            [value]="'automatic'"
            formControlName="credentialsMode"
            (change)="onCredentialsTypeChange()">
          <label class="form-check-label small" for="automatic">
            Crear automáticamente
          </label>
        </div>
        <div class="form-check">
          <input 
            class="form-check-input" 
            type="radio" 
            name="credentialsMode"
            id="manual"
            [value]="'manual'"
            formControlName="credentialsMode"
            (change)="onCredentialsTypeChange()">
          <label class="form-check-label small" for="manual">
            Crear manualmente
          </label>
        </div>
      </div>

      <!-- Vista previa credenciales automáticas -->
      @if (credentialsMode === 'automatic') {
        <div class="bg-light border rounded p-3 mb-4">
          <h6 class="fw-semibold mb-3">Vista previa de credenciales:</h6>
          <div class="row">
            <div class="col-md-6">
              <label class="form-label fw-medium small text-secondary">Usuario:</label>
              <div class="input-group">
                <input 
                  type="text" 
                  class="form-control rounded-start bg-white" 
                  [value]="generatedCredentials.username"
                  readonly>
                <button 
                  class="btn btn-outline-secondary rounded-end" 
                  type="button"
                  (click)="copyToClipboard(generatedCredentials.username)"
                  title="Copiar usuario">
                  <i class="fas fa-copy"></i>
                </button>
              </div>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-medium small text-secondary">Contraseña:</label>
              <div class="input-group">
                <input 
                  type="text" 
                  class="form-control rounded-start bg-white" 
                  [value]="generatedCredentials.password"
                  readonly>
                <button 
                  class="btn btn-outline-secondary rounded-end" 
                  type="button"
                  (click)="copyToClipboard(generatedCredentials.password)"
                  title="Copiar contraseña">
                  <i class="fas fa-copy"></i>
                </button>
              </div>
            </div>
          </div>
          <div class="mt-3">
            <button 
              class="btn btn-sm btn-outline-primary rounded"
              type="button"
              (click)="copyBothCredentials()"
              title="Copiar ambas credenciales">
              <i class="fas fa-copy me-1"></i>
              Copiar ambas credenciales
            </button>
            <button 
              class="btn btn-sm btn-outline-secondary rounded ms-2"
              type="button"
              (click)="regenerateCredentials()"
              title="Regenerar credenciales">
              <i class="fas fa-sync-alt me-1"></i>
              Regenerar
            </button>
          </div>
        </div>
      }

      <!-- Formulario credenciales manuales -->
      @if (credentialsMode === 'manual') {
        <div class="bg-light border rounded p-3 mb-4">
          <h6 class="fw-semibold mb-3 text-secondary">Credenciales manuales:</h6>
          <div class="row">
            <div class="col-md-6">
              <label class="form-label fw-medium small text-secondary">Usuario:</label>
              <input 
                type="text" 
                class="form-control rounded" 
                formControlName="manualUsername"
                name="manualUsername"
                placeholder="Ingrese el usuario">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-medium small text-secondary">Contraseña:</label>
              <input 
                type="text" 
                class="form-control rounded"
                formControlName="manualPassword"
                name="manualPassword"
                placeholder="Ingrese la contraseña">
            </div>
          </div>
        </div>
      }
    </div>
  </form>

  <div class="modal-footer">
    <button 
      type="button" 
      class="btn btn-secondary"
      (click)="onCancel()">
      Cancelar
    </button>
    <button 
      type="submit" 
      class="btn btn-success"
      [disabled]="formAddInternalUser.invalid"
      form="formAddInternalUser">
      Crear Usuario
    </button>
  </div>
</ng-template>
