<ng-template #modalAdd let-modal>
    <div class="modal-header bg-white border-bottom px-4">
        <h4 class="modal-title fw-semibold text-dark mb-0">{{ getTitle() }}</h4>
        <button 
        type="button" 
        class="btn-close" 
        aria-label="Close"
        (click)="onCancel()">
        </button>
    </div>

    @if (activeTab === 'sedes') {
        <form [formGroup]="formAddCampus" (ngSubmit)="addCampus()" id="formAddCampus">
            <div class="modal-body bg-white p-4">
                <div class="mb-3">     
                    <label class="form-label fw-medium small">Nombre de la sede</label>
                    <input 
                    type="text" 
                    class="form-control rounded" 
                    placeholder="Nombre de la sede"
                    name="campusName"
                    formControlName="name">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium small">Localización</label>
                    <input 
                    type="text" 
                    class="form-control rounded" 
                    placeholder="Localización"
                    name="locationCampus"
                    formControlName="location"
                    >
                </div>
            </div>
        </form>
        <div class="modal-footer bg-white border-top d-flex justify-content-end gap-2 p-3">
            <button 
            type="button" 
            class="btn btn-secondary rounded px-4"
            (click)="onCancel()">
            Cancelar
            </button>
            <button 
            type="submit" 
            class="btn btn-success rounded px-4"
            form="formAddCampus"
            [disabled]="formAddCampus.invalid">
            Registrar sede
            </button>
        </div>
    }
    @if (activeTab === 'niveles') {
        <form [formGroup]="formAddLevel" (ngSubmit)="addLevel()" id="formAddLevel">
            <div class="modal-body bg-white p-4">
                <div class="mb-3">     
                    <label class="form-label fw-medium small">Nombre del nivel/programa</label>
                    <input 
                    type="text" 
                    class="form-control rounded" 
                    placeholder="Nombre del nivel/programa"
                    name="levelName"
                    formControlName="name">
                </div>
            </div>
        </form>
        <div class="modal-footer bg-white border-top d-flex justify-content-end gap-2 p-3">
            <button 
            type="button" 
            class="btn btn-secondary rounded px-4"
            (click)="onCancel()">
            Cancelar
            </button>
            <button 
            type="submit" 
            class="btn btn-success rounded px-4"
            form="formAddLevel"
            [disabled]="formAddLevel.invalid">
            Registrar nivel/programa
            </button>
        </div>
    }
    @if (activeTab === 'grados') {
        <form [formGroup]="formAddGrade" (ngSubmit)="addGrade()" id="formAddGrade">
            <div class="modal-body bg-white p-4">
                <div class="mb-3">     
                    <label class="form-label fw-medium small">Nombre del grado</label>
                    <input 
                    type="text" 
                    class="form-control rounded" 
                    placeholder="Nombre del grado"
                    name="gradeName"
                    formControlName="name">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium small">Nivel</label>
                    <select
                        id="levelSelect"
                        class="form-select form-control"
                        formControlName="level"
                    >
                        <option value="" disabled>Selecciona un nivel</option>
                        @for (level of levels; track level.id) {
                            <option [value]="level.id"> {{level.name}} </option>
                        }
                    </select>
                </div>
            </div>
        </form>
        <div class="modal-footer bg-white border-top d-flex justify-content-end gap-2 p-3">
            <button 
            type="button" 
            class="btn btn-secondary rounded px-4"
            (click)="onCancel()">
            Cancelar
            </button>
            <button 
            type="submit" 
            class="btn btn-success rounded px-4"
            form="formAddGrade"
            [disabled]="formAddGrade.invalid">
            Registrar grado
            </button>
        </div>
    }
    @if (activeTab === 'secciones') {
        <form [formGroup]="formAddSection" (ngSubmit)="addSection()" id="formAddSection">
            <div class="modal-body bg-white p-4">
                <div class="mb-3">     
                    <label class="form-label fw-medium small">Nombre de la sección</label>
                    <input 
                    type="text" 
                    class="form-control rounded" 
                    placeholder="Nombre de la sección"
                    name="sectionName"
                    formControlName="name">
                </div>
            </div>
        </form>
        <div class="modal-footer bg-white border-top d-flex justify-content-end gap-2 p-3">
            <button 
            type="button" 
            class="btn btn-secondary rounded px-4"
            (click)="onCancel()">
            Cancelar
            </button>
            <button 
            type="submit" 
            class="btn btn-success rounded px-4"
            form="formAddSection"
            [disabled]="formAddSection.invalid">
            Registrar sección
            </button>
        </div>
    }
    @if (activeTab === 'periodos') {
        <form [formGroup]="formAddPeriod" (ngSubmit)="addPeriod()" id="formAddPeriod">
            <div class="modal-body bg-white p-4">
                <div class="mb-3">     
                    <label class="form-label fw-medium small">Nombre del periodo</label>
                    <input 
                    type="text" 
                    class="form-control rounded" 
                    placeholder="Nombre del periodo"
                    name="sectionName"
                    formControlName="name">
                </div>
                <div class="mb-3">     
                    <label class="form-label fw-medium small">Fecha de inicio</label>
                    <input 
                    type="date" 
                    class="form-control rounded" 
                    name="sectionName"
                    formControlName="startDate">
                </div>
                <div class="mb-3">     
                    <label class="form-label fw-medium small">Fecha de fin</label>
                    <input 
                    type="date" 
                    class="form-control rounded" 
                    name="sectionName"
                    formControlName="endDate">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-medium small">Estado</label>
                    <select
                        id="stateSelect"
                        class="form-select form-control"
                        formControlName="state"
                    >
                        <option [ngValue]="null" disabled selected>Selecciona un estado</option>
                        <option [ngValue]="true">En curso</option>
                        <option [ngValue]="false">Finalizado</option>
                    </select>
                </div>
            </div>
        </form>
        <div class="modal-footer bg-white border-top d-flex justify-content-end gap-2 p-3">
            <button 
            type="button" 
            class="btn btn-secondary rounded px-4"
            (click)="onCancel()">
            Cancelar
            </button>
            <button 
            type="submit" 
            class="btn btn-success rounded px-4"
            form="formAddPeriod"
            [disabled]="formAddPeriod.invalid">
            Registrar periodo
            </button>
        </div>
    }
    @if (activeTab === 'roles') {
        <form [formGroup]="formAddRole" (ngSubmit)="addRole()" id="formAddRole">
            <div class="modal-body bg-white p-4">
                <div class="mb-3">     
                    <label class="form-label fw-medium small">Rol</label>
                    <input 
                    type="text" 
                    class="form-control rounded" 
                    placeholder="Nombre del rol"
                    name="role"
                    formControlName="role">
                </div>
                <div class="mb-3">     
                    <label class="form-label fw-medium small">Descripción del rol</label>
                    <input 
                    type="text" 
                    class="form-control rounded" 
                    placeholder="Descripción del rol"
                    name="description"
                    formControlName="description">
                </div>
            </div>
        </form>
        <div class="modal-footer bg-white border-top d-flex justify-content-end gap-2 p-3">
            <button 
            type="button" 
            class="btn btn-secondary rounded px-4"
            (click)="onCancel()">
            Cancelar
            </button>
            <button 
            type="submit" 
            class="btn btn-success rounded px-4"
            form="formAddRole"
            [disabled]="formAddRole.invalid">
            Registrar rol
            </button>
        </div>
    }
    @if (activeTab === 'cursos') {
        <form [formGroup]="formAddCourse" (ngSubmit)="addCourse()" id="formAddCourse">
            <div class="modal-body bg-white p-4">
                <div class="mb-3">
                    <label class="form-label fw-medium small">Nombre del curso</label>
                    <input 
                    type="text" 
                    class="form-control rounded" 
                    placeholder="Nombre del curso"
                    name="courseName"
                    formControlName="name">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-medium small">Código del curso</label>
                    <input 
                    type="text" 
                    class="form-control rounded" 
                    placeholder="Código del curso"
                    name="courseCode"
                    formControlName="code">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-medium small">Descripción</label>
                    <input 
                    type="text" 
                    class="form-control rounded" 
                    placeholder="Descripción del curso"
                    name="courseDescription"
                    formControlName="description">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-medium small">Modalidad</label>
                    <select
                    class="form-select form-control"
                    formControlName="mode">
                    <option value="" disabled selected>Selecciona una modalidad</option>
                    <option value="Presencial">Presencial</option>
                    <option value="Virtual">Virtual</option>
                    <option value="Mixto">Mixto</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-medium small">Área</label>
                    <select class="form-select" formControlName="area" id="area">
                        <option value="" disabled selected>Seleccione un área</option>
                        @for (option of areaOptions; track $index) {
                            <option [value]="option.value">{{ option.label }}</option>
                        }
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-medium small">Tipo</label>
                    <select
                    class="form-select form-control"
                    formControlName="type">
                    <option value="" disabled selected>Selecciona un tipo</option>
                    <option value="Académico">Académico</option>
                    <option value="Extracurricular">Extracurricular</option>
                    <option value="Taller">Taller</option>
                    </select>
                </div>
            </div>
        </form>

        <div class="modal-footer bg-white border-top d-flex justify-content-end gap-2 p-3">
            <button 
            type="button" 
            class="btn btn-secondary rounded px-4"
            (click)="onCancel()">
            Cancelar
            </button>
            <button 
            type="submit" 
            class="btn btn-success rounded px-4"
            form="formAddCourse"
            [disabled]="formAddCourse.invalid">
            Registrar curso
            </button>
        </div>
    }
</ng-template>
