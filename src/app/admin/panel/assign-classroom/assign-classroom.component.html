<app-panel-header title="Asignación de cursos" />

<div class="mb-4 d-flex justify-content-center justify-content-md-end">
    <button class="btn-custom-green">
        <i class="fa-solid fa-plus me-2"></i>Añadir nueva asignación
    </button>
</div>
<div class="col-12">
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="card-title mb-0">Aulas</h5>
            <div class="input-group" style="width: 250px;">
            <span class="input-group-text"><i class="fas fa-search"></i></span>
            <input (input)="applyFilter($event)" type="text" class="form-control form-control-sm" placeholder="Buscar...">
            </div>
        </div>
        <div class="card-body p-3">
            <app-table
                #classroomTable
                [columns]="columns"
                [originalRows]="rows"
                [columnMappings]="columnMappings"
                [pageSize]="10"
                [acciones]="true"
                [editarFila]="true"
                [verFila]="false"
                [eliminarFila]="true"
            />
        </div>
    </div>
</div>
