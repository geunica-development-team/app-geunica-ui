<app-panel-header 
    title="Equipo académico"
/>
<div class="mb-4 d-flex justify-content-center justify-content-md-end">
    <button class="btn-custom-green" ><!--(click)="openModalAdd()"-->
        + Registrar nueva miembro
    </button>
</div>

<div class="col-12">
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="card-title mb-0">Equipo Academico</h5>
            <div class="input-group" style="width: 250px;">
            <span class="input-group-text"><i class="fas fa-search"></i></span>
            <input  type="text" class="form-control" placeholder="Buscar usuario...">
            </div><!--(input)="applyFilter($event)"-->
        </div>
        <div class="card-body p-3">
            <app-table
                #classroomTable
                [columns]="columns"
                [originalRows]="rows"
                [columnMappings]="columnMappings"
                [pageSize]="10"
                [acciones]="true"
                [editarFila]="true"
                [accionEditar]="openModalEdit.bind(this)"
                [verFila]="true"
                [eliminarFila]="true"
                [accionEliminar]="openModalDelete.bind(this)"
            />
        </div>
    </div>
</div>

<app-modal-add-academic-user-component
    #modalAdd
    (classroomAdded)="onCreatedOrEditedOrDeleted()"
/>

<app-modal-edit-academic-user-component
    #modalEdit
    (classroomEdited)="onCreatedOrEditedOrDeleted()"
/>

<app-modal-delete-academic-user-component
    #modalDelete
    (classroomDeleted)="onCreatedOrEditedOrDeleted()"
/>
