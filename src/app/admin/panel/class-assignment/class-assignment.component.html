<app-panel-header title="Asignacion de clases" />

<app-menu-tabs
    [tabs]="tabs"
    [activeTabId]="activeTab"
    (tabChanged)="setActiveTab($event)">

@if (activeTab === 'lunes') {

    <div class="mb-4 d-flex justify-content-center justify-content-md-end">
    <button class="btn-custom-green" (click)="modalAdd.openModal()">
        + Nuevo horario
    </button>
    </div>
    <div class="col-12">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="card-title mb-0">Lunes</h5>
                <div class="input-group" style="width: 250px;">
                <span class="input-group-text"><i class="fas fa-search"></i></span>
                <input (input)="applyFilter($event)" type="text" class="form-control" placeholder="Buscar sede...">
                </div>

            </div>
                <div class="card-body p-3">
                    <app-table
                        #campusTable
                        [columns]="columnsLunes"
                        [originalRows]="rowsLunes"
                        [columnMappings]="columnMappingsLunes"
                        [pageSize]="10"
                        [acciones]="true"
                        [editarFila]="true"
                        [accionEditar]="openModalEdit.bind(this)"
                        [verFila]="false"
                        [eliminarFila]="true"
                        [accionEliminar]="openModalDelete.bind(this)"
                    />
                </div>
        </div>
    </div>

}

</app-menu-tabs>

<app-modal-add
    #modalAdd
    [activeTab]="activeTab"
    (added)="onCreatedOrEditedOrDeleted()"
/>

<app-modal-edit
    #modalEdit
    [activeTab]="activeTab"
    (updated)="onCreatedOrEditedOrDeleted()"
/>

<app-modal-delete
    #modalDelete
    [activeTab]="activeTab"
    (deleted)="onCreatedOrEditedOrDeleted()"
/>
