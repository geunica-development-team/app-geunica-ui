<app-panel-header title="Cursos" />

<div class="container py-4">

  <!-- 1. Fila del buscador -->
  <div class="row mb-4">
    <div class="col-12 col-md-6">
      <app-searcher
        [(term)]="searchTerm"
        placeholder="Buscar por curso..."
        [items]="courses"
        field="courseName" 
        (filtered)="filteredCourse = $event"
      ></app-searcher>
    </div>
  </div>

  <!-- 2. Fila de las cards -->
      
    <div class="row g-4">
      <div class="col-12 col-sm-6 col-md-4 col-lg-3" *ngFor="let course of filteredCourse">
        
          <app-card-courses class="h-100"        
            [etiquetaTitulo]="'CURSO'"
            [titulo]="course.courseName"
            [etiquetaSubtitulo1]="'CÓDIGO'"
            [subtitulo1]="course.courseCode"
            [etiquetaSubtitulo2]="'DOCENTE'"
            [subtitulo2]="course.teacherName"
            [link]="['/student/panel/courses', course.classAssignmentId, 'curriculum']">
            <a [routerLink]="['/curriculum', course.classAssignmentId]">Ver temario</a>
            </app-card-courses>
      </div>
    </div>



</div>
