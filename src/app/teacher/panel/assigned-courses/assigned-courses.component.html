<div class="container py-4">

  <!-- 1. Fila del buscador -->
  <div class="row mb-4">
    <div class="col-12 col-md-6">
      <app-searcher
        [(term)]="searchTerm"
        placeholder="Buscar por curso"
        [items]="courses"
        field="title"
        (filtered)="filteredCourses = $event"
        (search)="onSearch()"
      ></app-searcher>
    </div>
  </div>

  <!-- 2. Fila de las cards -->
      
    <div class="row g-4">
      <div class="col-12 col-sm-6 col-md-4 col-lg-3" *ngFor="let course of filteredCourses">
        
          <app-card-courses class="h-100"
            [etiquetaTitulo]="'CURSO'"
            [titulo]="course.nombre"
            [etiquetaSubtitulo1]="'CÓDIGO'"
            [subtitulo1]="course.codigo"
            [link]="['/teacher/panel/coursesAsigned', course.id_curso, 'curriculumManagment']">
            
            <!-- el link tenemos que cambiarlo, lo mejor seria crear un curriculum para profesor 
             [link]="['/teacher/panel/curriculumManagment', course.id_curso, 'curriculum']">-->

            </app-card-courses>
      </div>
    </div>



</div>
