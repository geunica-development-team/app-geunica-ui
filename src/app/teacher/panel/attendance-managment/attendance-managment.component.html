<app-panel-header title="asistencias" />

<div class="container py-4">

  <!-- 1. Fila del buscador -->
  <div class="row mb-4">
    <div class="col-12 col-md-6">
      <app-searcher
        [(term)]="searchTerm"
        placeholder="Buscar por curso"
        field="title"
        (search)="onSearch()"
      ></app-searcher>
    </div>
  </div>

  <!-- 2. Fila de las cards -->

  <div class="col-12">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="card-title mb-0">Gestion de asistencias</h5>
                <div class="input-group" style="width: 250px;">
                <span class="input-group-text"><i class="fas fa-search"></i></span>
                <input type="text" class="form-control" placeholder="Buscar por aula...">
                </div>
            </div>
            <div class="card-body p-3">
                <app-table
                    #attendanceTable
                    [columns]="columnsAttendances"
                    [originalRows]="rowsAttendances"
                    [columnMappings]="columnMappingsAttendances"
                    [pageSize]="10"
                    [acciones]="true"
                    [verFila]="true"
                    [accionVer]="onVerFicha"
                />
            </div>
        </div>
    </div><!--"-->

</div>
