<app-panel-header title="asistencias"></app-panel-header>

<div class="container py-4">
  <!-- buscador -->
  <div class="row mb-4">
    <div class="col-12 col-md-6">
      <div class="input-group">
        <span class="input-group-text"><i class="fas fa-search"></i></span>
        <input
          type="text"
          class="form-control"
          placeholder="Buscar por grado/nivel/sección o aula..."
          [value]="searchTerm"
          (input)="onSearchInput($event)"
        />
      </div>
    </div>
  </div>

  <!-- tarjeta con tabla -->
  <div class="col-12">
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="card-title mb-0">Gestión de asistencias</h5>
      </div>

      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead class="table-light">
              <tr>
                <th>ID</th>
                <th>Grado/Nivel/Sección</th>
                <th>Aula</th>
                <th>Turno</th>
                <th style="width: 110px;">Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let row of filteredAttendances; trackBy: trackById">
                <td>{{ row.id }}</td>
                <td>{{ row.gradoSeccion }}</td>
                <td>{{ row.aula }}</td>
                <td>{{ row.turno }}</td>
                <td>
                  <button class="btn btn-sm btn-primary" (click)="onVerFicha(row)">
                    Ver
                  </button>
                </td>
              </tr>

              <tr *ngIf="filteredAttendances.length === 0">
                <td colspan="5" class="text-center py-3">No hay registros</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
