<app-panel-header title="Alumnos del aula" />

<div class="container py-4">
  <!-- Sección de gestión de evaluaciones -->
  <div class="row mb-4">
    <div class="col-12">
      <div class="management-grid">
        <!-- Gestión de Exámenes -->
        <div class="management-section">
          <h6 class="section-title">
            <i class="fas fa-file-alt"></i>
            Gestión de Exámenes
            <span class="stats-badge">{{totalExams || 0}} activos</span>
          </h6>
          <div class="btn-group-custom">
            <button 
              class="btn btn-action btn-create btn-sm-custom" 
              (click)="openCreateExamModal()"
              type="button">
              <i class="fas fa-plus"></i>
              Crear Examen
            </button>
            <button 
              class="btn btn-action btn-edit btn-sm-custom" 
              (click)="showExamListForEdit()"
              type="button">
              <i class="fas fa-edit"></i>
              Editar
            </button>
            <button 
              class="btn btn-action btn-delete btn-sm-custom" 
              (click)="showExamListForDelete()"
              type="button">
              <i class="fas fa-trash"></i>
              Eliminar
            </button>
          </div>
        </div>

        <!-- Gestión de Actividades -->
        <div class="management-section">
          <h6 class="section-title">
            <i class="fas fa-tasks"></i>
            Gestión de Actividades
            <span class="stats-badge">{{totalActivities || 0}} activas</span>
          </h6>
          <div class="btn-group-custom">
            <button 
              class="btn btn-action btn-create btn-sm-custom" 
              (click)="openCreateActivityModal()"
              type="button">
              <i class="fas fa-plus"></i>
              Crear Actividad
            </button>
            <button 
              class="btn btn-action btn-edit btn-sm-custom" 
              (click)="showActivityListForEdit()"
              type="button">
              <i class="fas fa-edit"></i>
              Editar
            </button>
            <button 
              class="btn btn-action btn-delete btn-sm-custom" 
              (click)="showActivityListForDelete()"
              type="button">
              <i class="fas fa-trash"></i>
              Eliminar
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Sección de búsqueda -->
  <div class="row mb-4">
    <div class="col-12 col-md-6">
      <div class="input-group">
        <span class="input-group-text">
          <i class="fas fa-search"></i>
        </span>
        <input 
          [(ngModel)]="searchTerm"
          
          type="text" 
          class="form-control" 
          placeholder="Buscar por nombre de estudiante..."
        /><!--(input)="onSearch()"-->
      </div>
    </div>
  </div>

  <!-- Tabla de estudiantes -->
  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h5 class="card-title mb-0">
            <i class="fas fa-users me-2"></i>
            Lista de Estudiantes
          </h5>
          <div class="d-flex align-items-center gap-3">
            <span class="text-muted">
              <i class="fas fa-user-graduate"></i>
              Total: <strong>{{rowsAssignments.length}} estudiantes</strong>
            </span>
          </div>
        </div>
        <div class="card-body p-3">
          <app-table
            #assignmentsTable
            [columns]="columnsAssignments"
            [originalRows]="rowsAssignments"
            [columnMappings]="columnMappingsAssignments"
            [pageSize]="10"
            [acciones]="true"
            [verFila]="true"
            [accionVer]="onVerNotas"
          />
        </div>
      </div>
    </div>
  </div>
</div>
