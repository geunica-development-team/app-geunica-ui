<app-panel-header title="Gestion de notas" />
<div class="container py-4">


<div class="col-12">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="card-title mb-0">Gestion de notas</h5>
                <div class="input-group" style="width: 250px;">
                <span class="input-group-text"><i class="fas fa-search"></i></span>
                <input (input)="applyFilter($event)" type="text" class="form-control" placeholder="Buscar por aula...">
                </div>
            </div>
            <div class="card-body p-3">
                <app-table
                    #notesTable
                    [columns]="columnsNotes"
                    [originalRows]="rowsNotes"
                    [columnMappings]="columnMappingsNotes"
                    [pageSize]="10"
                    [acciones]="true"
                    [verFila]="true"
                    [accionVer]="onVerFicha"
                />
            </div>
        </div>
    </div><!--[verFila]="openModalVer.bind(this)"-->


</div>
