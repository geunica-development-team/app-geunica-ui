<app-panel-header title="Gestion de notas" />
<div class="container py-4">

    <div class="row mb-4">
        <div class="col-12 col-md-6">
        <app-searcher
            [(term)]="searchTerm"
            placeholder="Buscar por aula"
            field="title"
            (search)="onSearch()"
        ></app-searcher>
        </div>
    </div>

<div class="col-12">
        <div class="card">

            <div class="card-body p-3">
                <app-table
                    #notesTable
                    [columns]="columnsNotes"
                    [originalRows]="rowsNotes"
                    [columnMappings]="columnMappingsNotes"
                    [pageSize]="10"
                    [acciones]="true"
                    [verFila]="true"
                    [accionVer]="onVerFicha"
                />
            </div>
        </div>
    </div><!--[verFila]="openModalVer.bind(this)"-->


</div>
