
<div class="container py-4">
  <div class="card">
   
      <!-- Navegación de semana -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <button class="btn btn-outline-secondary me-2">&laquo; Anterior</button>
        <button class="btn btn-success me-2">Semana</button>
        <button class="btn btn-outline-secondary">Siguiente &raquo;</button>
      </div>
      <small class="text-muted">10 Julio 2025 - 16 Julio 2025</small>
    </div>

    <!-- Título del salón -->
    <h5 class="mb-3">Estudiantes de este aula</h5>

    <!-- Tabla de asistencia -->
    <div class="table-responsive">
      <table class="table align-middle table-bordered rounded shadow-sm">
        <thead class="table-success">
          <tr>
            <th>Estudiante</th>
            <th *ngFor="let day of days" class="text-center">{{ day }}</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let student of students">
            <td>{{ student.name }}</td>
            <td *ngFor="let rec of student.records" class="text-center">
              <div class="dropdown">
                <button 
                  class="btn dropdown-toggle" 
                  type="button"
                  [ngClass]="statusClass(rec.status)">
                  {{ rec.status | uppercase }}
                </button>
                <ul class="dropdown-menu">
                  <li *ngFor="let opt of getOtherStatuses(rec.status)">
                    <a class="dropdown-item" (click)="rec.status = opt">
                      {{ opt | uppercase }}
                    </a>
                  </li>
                </ul>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>
</div>
