 <div class="modal fade" [class.show]="isOpen" [style.display]="isOpen ? 'block' : 'none'" 
         tabindex="-1" *ngIf="isOpen">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header bg-danger text-white">
            <h5 class="modal-title">
              <i class="bi bi-exclamation-triangle me-2"></i>
              Confirmar Eliminación
            </h5>
            <button type="button" class="btn-close btn-close-white" (click)="closeModal()"></button>
          </div>
          <div class="modal-body">
            <div class="text-center mb-4">
              <i class="bi bi-trash text-danger" style="font-size: 3rem;"></i>
            </div>
            
            <h6 class="text-center mb-3">¿Estás seguro de eliminar este tema?</h6>
            
            <div class="alert alert-light border text-center">
              <strong>{{ itemData.title }}</strong>
              <div class="small text-muted mt-1" *ngIf="itemData.description">
                {{ itemData.description }}
              </div>
              <div class="small text-muted mt-1">
                <i class="bi bi-hash"></i> Posición: {{ itemData.position }}
              </div>
            </div>
            
            <p class="text-muted small text-center mb-0">
              <i class="bi bi-info-circle me-1"></i>
              Esta acción no se puede deshacer.
            </p>
          </div>
          <div class="modal-footer justify-content-center">
            <button type="button" class="btn btn-secondary" (click)="closeModal()">
              <i class="bi bi-x-lg me-1"></i>
              Cancelar
            </button>
            <button type="button" class="btn btn-danger" (click)="onConfirmDelete()" [disabled]="deleting">
              <i class="bi bi-trash me-1" *ngIf="!deleting"></i>
              <span class="spinner-border spinner-border-sm me-1" *ngIf="deleting"></span>
              {{ deleting ? 'Eliminando...' : 'Sí, Eliminar' }}
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Overlay -->
    <div class="modal-backdrop fade show" *ngIf="isOpen"></div>
